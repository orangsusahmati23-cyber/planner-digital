<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📔 Digital Planner Interaktif 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
:root{
  --primary:#6366f1; --primary-dark:#4f46e5; --secondary:#ec4899;
  --accent:#f59e0b; --success:#10b981; --danger:#ef4444;
  --bg:#f8fafc; --card-bg:#ffffff; --text:#1e293b; --text-light:#64748b;
  --border:#e2e8f0; --shadow:0 4px 20px rgba(0,0,0,0.08);
  --shadow-lg:0 10px 40px rgba(0,0,0,0.12); --radius:16px; --radius-sm:8px;
}
[data-theme="dark"]{
  --bg:#0f172a; --card-bg:#1e293b; --text:#f1f5f9; --text-light:#94a3b8;
  --border:#334155; --shadow:0 4px 20px rgba(0,0,0,0.3);
}
body{ background:var(--bg); color:var(--text); overflow-x:hidden; transition:background .3s,color .3s; }

/* LOADER */
#loader{ position:fixed; inset:0; background:linear-gradient(135deg,#6366f1,#ec4899);
  display:flex; align-items:center; justify-content:center; z-index:9999;
  transition:opacity .5s; }
#loader.hide{ opacity:0; pointer-events:none; }
.loader-content{ text-align:center; color:#fff; }
.loader-content h1{ font-size:2.5rem; margin-bottom:20px; }
.spinner{ width:60px; height:60px; border:4px solid rgba(255,255,255,.3);
  border-top-color:#fff; border-radius:50%; animation:spin 1s linear infinite; margin:20px auto; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* SIDEBAR */
.sidebar{ position:fixed; left:-320px; top:0; width:300px; height:100vh;
  background:var(--card-bg); box-shadow:var(--shadow-lg); z-index:1000;
  transition:left .3s ease; display:flex; flex-direction:column; overflow-y:auto; }
.sidebar.open{ left:0; }
.sidebar-header{ padding:20px; background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff; display:flex; justify-content:space-between; align-items:center; }
.close-sidebar{ background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer; }
.sidebar-nav{ flex:1; padding:20px 10px; }
.nav-section{ margin-bottom:20px; }
.nav-section h3{ font-size:.75rem; text-transform:uppercase; color:var(--text-light);
  padding:0 10px; margin-bottom:10px; letter-spacing:1px; }
.sidebar-nav a{ display:flex; align-items:center; gap:12px; padding:12px 15px;
  color:var(--text); text-decoration:none; border-radius:var(--radius-sm);
  margin-bottom:4px; transition:all .2s; font-size:.9rem; cursor:pointer; }
.sidebar-nav a:hover, .sidebar-nav a.active{ background:var(--primary); color:#fff; transform:translateX(5px); }
.sidebar-nav a span{ font-size:1.2rem; }
.sidebar-footer{ padding:15px; border-top:1px solid var(--border); display:flex; gap:8px; }
.btn-export,.btn-import{ flex:1; padding:10px; border:none; border-radius:var(--radius-sm);
  cursor:pointer; font-size:.8rem; background:var(--primary); color:#fff; transition:.2s; }
.btn-export:hover,.btn-import:hover{ opacity:.9; transform:translateY(-2px); }

/* MAIN */
.main-content{ min-height:100vh; padding:20px; display:flex; flex-direction:column; }
.topbar{ display:flex; align-items:center; gap:20px; background:var(--card-bg);
  padding:20px 25px; border-radius:var(--radius); box-shadow:var(--shadow);
  margin-bottom:20px; flex-wrap:wrap; }
.menu-btn{ background:var(--primary); color:#fff; border:none; padding:12px 16px;
  border-radius:var(--radius-sm); font-size:1.2rem; cursor:pointer; transition:.2s; }
.menu-btn:hover{ transform:scale(1.05); }
.topbar-info{ flex:1; min-width:150px; }
.topbar-info h1{ font-size:1.5rem; font-weight:600; }
.topbar-info p{ color:var(--text-light); font-size:.85rem; }
.topbar-actions{ display:flex; align-items:center; gap:15px; flex-wrap:wrap; }
.clock{ font-family:'Courier New',monospace; font-size:1.3rem; font-weight:600;
  color:var(--primary); background:var(--bg); padding:8px 15px; border-radius:var(--radius-sm); }
.date-today{ color:var(--text-light); font-size:.9rem; }
.theme-toggle{ background:var(--bg); border:none; padding:10px; border-radius:50%;
  font-size:1.2rem; cursor:pointer; transition:.3s; }
.theme-toggle:hover{ transform:rotate(20deg) scale(1.1); }

/* PAGES */
.pages-container{ flex:1; position:relative; }
.page{ display:none; animation:fadeIn .4s ease; background:var(--card-bg);
  padding:30px; border-radius:var(--radius); box-shadow:var(--shadow); min-height:500px; }
.page.active{ display:block; }
@keyframes fadeIn{ from{ opacity:0; transform:translateY(20px); } to{ opacity:1; transform:translateY(0); } }
.page h2{ font-size:1.8rem; margin-bottom:20px; color:var(--primary);
  border-bottom:3px solid var(--primary); padding-bottom:10px; display:inline-block; }
.page h3{ margin:20px 0 10px; color:var(--primary); font-size:1.1rem; }

/* CARDS */
.card-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; margin:20px 0; }
.card{ background:var(--bg); padding:25px; border-radius:var(--radius);
  border-left:5px solid var(--primary); transition:.3s; cursor:pointer; }
.card:hover{ transform:translateY(-5px); box-shadow:var(--shadow-lg); }
.card h3{ font-size:1rem; color:var(--text-light); margin-bottom:10px; }
.card .value{ font-size:2rem; font-weight:700; color:var(--primary); }
.card .unit{ font-size:.9rem; color:var(--text-light); }

/* INPUTS */
input,textarea,select{ width:100%; padding:12px 15px; border:2px solid var(--border);
  border-radius:var(--radius-sm); background:var(--bg); color:var(--text);
  font-family:inherit; font-size:.95rem; margin-bottom:10px; transition:.2s; }
input:focus,textarea:focus,select:focus{ outline:none; border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(99,102,241,0.1); }
button{ cursor:pointer; font-family:inherit; }
.btn{ padding:12px 24px; background:var(--primary); color:#fff; border:none;
  border-radius:var(--radius-sm); font-size:.95rem; font-weight:500; transition:.2s; }
.btn:hover{ background:var(--primary-dark); transform:translateY(-2px); }
.btn-danger{ background:var(--danger); }
.btn-success{ background:var(--success); }
.btn-sm{ padding:6px 12px; font-size:.8rem; }

/* TODO */
.todo-input-row{ display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
.todo-input-row input{ margin:0; flex:1; min-width:150px; }
.todo-list{ list-style:none; }
.todo-item{ display:flex; align-items:center; gap:12px; padding:15px;
  background:var(--bg); border-radius:var(--radius-sm); margin-bottom:10px;
  transition:.2s; animation:slideIn .3s ease; }
.todo-item:hover{ transform:translateX(5px); }
.todo-item.done{ opacity:.6; text-decoration:line-through; }
.todo-item input[type=checkbox]{ width:20px; height:20px; margin:0; cursor:pointer; }
.todo-item span{ flex:1; }
.delete-btn{ background:var(--danger); color:#fff; border:none; padding:6px 10px;
  border-radius:6px; cursor:pointer; font-size:.8rem; }
@keyframes slideIn{ from{ opacity:0; transform:translateX(-20px); } to{ opacity:1; transform:translateX(0); } }

/* CALENDAR */
.calendar-header{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px;
  margin-bottom:10px; font-weight:600; text-align:center; color:var(--primary); }
.calendar{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
.calendar-day{ aspect-ratio:1; display:flex; align-items:center; justify-content:center;
  background:var(--bg); border-radius:8px; cursor:pointer; transition:.2s; font-size:.9rem; }
.calendar-day:hover{ background:var(--primary); color:#fff; transform:scale(1.05); }
.calendar-day.today{ background:var(--secondary); color:#fff; font-weight:700; }
.calendar-day.empty{ background:transparent; cursor:default; }
.calendar-nav{ display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; }

/* HABIT */
.habit-grid{ display:grid; grid-template-columns:150px repeat(31,minmax(22px,1fr));
  gap:3px; overflow-x:auto; padding:10px 0; }
.habit-cell{ aspect-ratio:1; border-radius:4px; background:var(--bg);
  border:1px solid var(--border); cursor:pointer; min-width:20px; }
.habit-cell.done{ background:var(--success); border-color:var(--success); }
.habit-cell.header{ background:var(--primary); color:#fff; display:flex;
  align-items:center; justify-content:center; font-size:.7rem; font-weight:600; }
.habit-cell.name{ background:transparent; border:none; display:flex;
  align-items:center; padding:5px; font-size:.85rem; }

/* JOURNAL */
.journal-textarea{ width:100%; min-height:250px; padding:20px; font-size:1rem;
  line-height:1.6; resize:vertical; }
.mood-selector{ display:flex; gap:10px; margin:15px 0; flex-wrap:wrap; }
.mood-btn{ font-size:2rem; padding:10px 15px; background:var(--bg);
  border:2px solid transparent; border-radius:var(--radius-sm); cursor:pointer; transition:.2s; }
.mood-btn:hover,.mood-btn.selected{ border-color:var(--primary); transform:scale(1.1); }

/* GOALS */
.goal-item{ background:var(--bg); padding:20px; border-radius:var(--radius);
  margin-bottom:15px; border-left:5px solid var(--accent); }
.goal-item h4{ margin-bottom:10px; }
.progress-container{ background:var(--border); height:12px; border-radius:10px;
  overflow:hidden; margin:10px 0; }
.progress-container .fill{ height:100%;
  background:linear-gradient(90deg,var(--primary),var(--secondary)); transition:width .5s; }

/* FINANCE */
.finance-summary{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:15px; margin:20px 0; }
.finance-card{ background:var(--bg); padding:20px; border-radius:var(--radius); text-align:center; }
.finance-card.income{ border-top:4px solid var(--success); }
.finance-card.expense{ border-top:4px solid var(--danger); }
.finance-card.balance{ border-top:4px solid var(--primary); }
.finance-card .val{ font-size:1.4rem; font-weight:700; margin-top:8px; }

/* MOOD BOARD */
.mood-board{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:15px; margin:20px 0; }
.mood-item{ aspect-ratio:1; background:linear-gradient(135deg,var(--primary),var(--secondary));
  border-radius:var(--radius); display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:1rem; text-align:center; padding:20px; cursor:pointer; transition:.3s; }
.mood-item:hover{ transform:scale(1.05) rotate(2deg); }

/* PAGE NAV */
.page-nav{ display:flex; justify-content:space-between; align-items:center;
  margin-top:20px; padding:15px 25px; background:var(--card-bg);
  border-radius:var(--radius); box-shadow:var(--shadow); gap:15px; flex-wrap:wrap; }
.nav-btn{ padding:10px 20px; background:var(--primary); color:#fff; border:none;
  border-radius:var(--radius-sm); cursor:pointer; transition:.2s; }
.nav-btn:hover{ background:var(--primary-dark); }
.page-indicator{ flex:1; text-align:center; font-weight:500; min-width:150px; }
.progress-bar{ height:6px; background:var(--border); border-radius:3px;
  margin-top:8px; overflow:hidden; }
.progress-fill{ height:100%;
  background:linear-gradient(90deg,var(--primary),var(--secondary)); transition:width .3s; }

/* FAB */
.fab-container{ position:fixed; bottom:30px; right:30px; z-index:500; }
.fab{ width:60px; height:60px; border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--secondary)); color:#fff;
  border:none; font-size:1.5rem; cursor:pointer; box-shadow:var(--shadow-lg); transition:.3s; }
.fab:hover{ transform:scale(1.1) rotate(20deg); }
.fab-menu{ position:absolute; bottom:75px; right:0; display:none; flex-direction:column;
  gap:8px; background:var(--card-bg); padding:10px; border-radius:var(--radius);
  box-shadow:var(--shadow-lg); min-width:200px; }
.fab-menu.open{ display:flex; animation:fadeIn .3s; }
.fab-menu button{ padding:12px 15px; background:var(--bg); border:none;
  border-radius:var(--radius-sm); text-align:left; cursor:pointer; transition:.2s; color:var(--text); }
.fab-menu button:hover{ background:var(--primary); color:#fff; }

/* MODAL */
.modal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.6);
  z-index:2000; align-items:center; justify-content:center; padding:20px; }
.modal.open{ display:flex; animation:fadeIn .3s; }
.modal-content{ background:var(--card-bg); padding:30px; border-radius:var(--radius);
  max-width:500px; width:100%; box-shadow:var(--shadow-lg); }
.modal-content h2{ margin-bottom:20px; color:var(--primary); }
.modal-close{ margin-top:15px; width:100%; padding:12px; background:var(--danger);
  color:#fff; border:none; border-radius:var(--radius-sm); cursor:pointer; }
.pomodoro-timer{ font-size:4rem; font-weight:700; text-align:center;
  color:var(--primary); margin:20px 0; font-family:'Courier New',monospace; }
.pomodoro-controls,.pomodoro-modes{ display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap; }
.pomodoro-controls button,.pomodoro-modes button{ flex:1; padding:10px; border:none;
  border-radius:var(--radius-sm); background:var(--primary); color:#fff; cursor:pointer; }
.pomodoro-modes button{ background:var(--bg); color:var(--text); }

/* NOTIF */
.notification{ position:fixed; top:20px; right:20px; padding:15px 25px;
  background:var(--success); color:#fff; border-radius:var(--radius-sm);
  box-shadow:var(--shadow-lg); transform:translateX(400px); transition:.3s; z-index:3000; }
.notification.show{ transform:translateX(0); }

/* SECTION BOX */
.section-box{ background:var(--bg); padding:20px; border-radius:var(--radius); margin-bottom:15px; }
.grid-2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:15px; }
.tag{ display:inline-block; padding:4px 12px; border-radius:20px; font-size:.75rem;
  background:var(--primary); color:#fff; margin:2px; }
.list-item{ padding:12px 15px; background:var(--bg); border-radius:var(--radius-sm);
  margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
.empty-state{ text-align:center; padding:40px 20px; color:var(--text-light); }
.empty-state .icon{ font-size:3rem; margin-bottom:10px; }

@media(max-width:768px){
  .topbar{ flex-direction:column; align-items:stretch; }
  .page{ padding:20px; }
  .page h2{ font-size:1.4rem; }
  .habit-grid{ grid-template-columns:100px repeat(31,minmax(22px,1fr)); }
  .fab{ width:50px; height:50px; }
  .pomodoro-timer{ font-size:3rem; }
}
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="loader-content">
    <h1>📔 Digital Planner</h1>
    <div class="spinner"></div>
    <p>Memuat planner Anda...</p>
  </div>
</div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>📔 Planner 2026</h2>
    <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
  </div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-footer">
    <button onclick="exportData()" class="btn-export">💾 Export</button>
    <button onclick="importData()" class="btn-import">📥 Import</button>
    <button onclick="clearAll()" class="btn-import" style="background:var(--danger)">🗑️ Reset</button>
  </div>
</aside>

<!-- MAIN -->
<main class="main-content">
  <header class="topbar">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <div class="topbar-info">
      <h1 id="pageTitle">Dashboard</h1>
      <p id="pageSubtitle">Selamat datang! 👋</p>
    </div>
    <div class="topbar-actions">
      <div class="clock" id="clock">00:00:00</div>
      <div class="date-today" id="dateToday"></div>
      <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    </div>
  </header>

  <div class="pages-container" id="pagesContainer"></div>

  <footer class="page-nav">
    <button onclick="prevPage()" class="nav-btn">← Sebelumnya</button>
    <div class="page-indicator">
      <span id="currentPageNum">1</span> / <span id="totalPages">100</span>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <button onclick="nextPage()" class="nav-btn">Selanjutnya →</button>
  </footer>
</main>

<!-- FAB -->
<div class="fab-container">
  <button class="fab" onclick="toggleQuickMenu()">⚡</button>
  <div class="fab-menu" id="fabMenu">
    <button onclick="quickAdd('todo')">✅ Tambah To-Do</button>
    <button onclick="quickAdd('note')">📝 Catatan Cepat</button>
    <button onclick="startPomodoro()">⏱️ Pomodoro</button>
    <button onclick="goToPage(0)">📊 Dashboard</button>
  </div>
</div>

<!-- POMODORO MODAL -->
<div class="modal" id="pomodoroModal">
  <div class="modal-content">
    <h2>⏱️ Pomodoro Timer</h2>
    <div class="pomodoro-timer" id="pomodoroTimer">25:00</div>
    <div class="pomodoro-controls">
      <button onclick="startPomodoroTimer()">▶️ Start</button>
      <button onclick="pausePomodoro()">⏸️ Pause</button>
      <button onclick="resetPomodoro()">🔄 Reset</button>
    </div>
    <div class="pomodoro-modes">
      <button onclick="setPomodoroMode(25)">Fokus 25m</button>
      <button onclick="setPomodoroMode(5)">Break 5m</button>
      <button onclick="setPomodoroMode(15)">Long 15m</button>
    </div>
    <button onclick="closePomodoro()" class="modal-close">Tutup</button>
  </div>
</div>

<div id="notification" class="notification"></div>

<script>
/* ============================================================
   DIGITAL PLANNER - SINGLE FILE APP
   ============================================================ */

/* ---------- LOADER FIX ---------- */
function hideLoader(){
  const l = document.getElementById('loader');
  if(l){ l.classList.add('hide'); setTimeout(()=>l.remove(), 600); }
}
window.addEventListener('load', () => setTimeout(hideLoader, 400));
setTimeout(hideLoader, 2500); // fallback

/* ---------- DATA ---------- */
const STORAGE_KEY = 'digitalPlanner2026';

let state = {
  currentPage: 0,
  theme: 'light',
  todos: {},
  goals: [],
  habits: { names:['Minum Air','Olahraga','Baca Buku','Meditasi','Journaling'], data:{} },
  journal: {},
  gratitude: {},
  finance: [],
  braindump: '',
  meetingNotes: [],
  moodboard: ['🌟 Dream Big','💪 Stay Strong','🌸 Be Kind','🚀 Take Action','✨ Believe'],
  notes: {},
  settings: { name: 'Pengguna' }
};

function loadState(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved){
      const parsed = JSON.parse(saved);
      state = Object.assign(state, parsed);
    }
  }catch(e){ console.warn('Load error:', e); }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn('Save error:', e); }
}

/* ---------- PAGES DEFINITION (100 PAGES) ---------- */
const PAGE_GROUPS = [
  { name:'🏠 Menu Utama', pages:[

    {t:'To-Do Harian', s:'Kelola tugas harian', i:'✅', type:'todo'},
    {t:'Goals Tahunan', s:'Target tahun 2026', i:'🎯', type:'goals'},
    {t:'Habit Tracker', s:'Lacak kebiasaan baik', i:'📈', type:'habit'},
    {t:'Keuangan', s:'Catat pemasukan & pengeluaran', i:'💰', type:'finance'},

    {t:'Bacaan & Belajar', s:'Daftar buku & materi', i:'📚', type:'reading'},
    {t:'Jurnal Harian', s:'Tulis jurnal Anda', i:'📓', type:'journal'},
    {t:'Gratitude', s:'Syukur hari ini', i:'🌟', type:'gratitude'}
  ]},
  { name:'💡 Produktivitas', pages:[
    {t:'Brain Dump', s:'Tuangkan semua ide', i:'🧠', type:'braindump'},
    {t:'Meeting Notes', s:'Catatan rapat', i:'📋', type:'meeting'},
    {t:'Mood Board', s:'Visualisasi mood', i:'🎨', type:'mood'},
    {t:'Pengaturan', s:'Atur planner Anda', i:'⚙️', type:'settings'},
    {t:'Weekly Planner', s:'Rencana mingguan', i:'🗓️', type:'weekly'},
    {t:'Monthly Planner', s:'Rencana bulanan', i:'📆', type:'monthly'},
    {t:'Daily Focus', s:'Fokus hari ini', i:'🎯', type:'focus'},
    {t:'Time Blocking', s:'Blok waktu produktif', i:'⏰', type:'timeblock'},
    {t:'Priority Matrix', s:'Eisenhower matrix', i:'🔲', type:'matrix'},
    {t:'Pomodoro Log', s:'Log sesi fokus', i:'🍅', type:'pomodoro'}
  ]},
  { name:'📝 Perencanaan', pages:[
    {t:'Vision Board', s:'Visi hidup Anda', i:'🌈', type:'vision'},
    {t:'Bucket List', s:'Daftar impian', i:'🪣', type:'bucket'},
    {t:'Karir & Bisnis', s:'Rencana karir', i:'💼', type:'career'},
    {t:'Travel Planner', s:'Rencana liburan', i:'✈️', type:'travel'},
    {t:'Meal Planner', s:'Menu makanan', i:'🍽️', type:'meal'},
    {t:'Belanja', s:'Daftar belanja', i:'🛒', type:'shopping'},
    {t:'Packing List', s:'Daftar bawaan', i:'🧳', type:'packing'},
    {t:'Project Tracker', s:'Lacak proyek', i:'📁', type:'project'},
    {t:'Client Manager', s:'Kelola klien', i:'👥', type:'client'},
    {t:'Invoice Tracker', s:'Lacak invoice', i:'🧾', type:'invoice'}
  ]},
  { name:'💪 Kesehatan', pages:[
    {t:'Workout Log', s:'Catatan olahraga', i:'💪', type:'workout'},
    {t:'Water Intake', s:'Konsumsi air', i:'💧', type:'water'},
    {t:'Sleep Tracker', s:'Pola tidur', i:'😴', type:'sleep'},

// Flatten pages
const PAGES = [];
let pageIndex = 0;
PAGE_GROUPS.forEach(group => {
  group.pages.forEach(p => {
    PAGES.push({ ...p, group: group.name, globalIndex: pageIndex++ });
  });
});

/* ---------- RENDER SIDEBAR ---------- */
function renderSidebar(){
  const nav = document.getElementById('sidebarNav');
  let html = '';
  PAGE_GROUPS.forEach(group => {
    html += `<div class="nav-section"><h3>${group.name}</h3>`;
    group.pages.forEach(p => {
      const idx = PAGES.findIndex(x => x.t === p.t && x.type === p.type);
      html += `<a onclick="goToPage(${idx});return false;" data-idx="${idx}">
        <span>${p.i}</span> ${p.t}</a>`;
    });
    html += '</div>';
  });
  nav.innerHTML = html;
}

/* ---------- RENDER PAGE CONTENT ---------- */
function renderPage(index){
  const page = PAGES[index];
  if(!page) return;

  document.getElementById('pageTitle').textContent = `${page.i} ${page.t}`;
  document.getElementById('pageSubtitle').textContent = page.s;
  document.getElementById('currentPageNum').textContent = index + 1;
  document.getElementById('totalPages').textContent = PAGES.length;
  document.getElementById('progressFill').style.width = ((index+1)/PAGES.length*100) + '%';

  // Highlight sidebar
  document.querySelectorAll('.sidebar-nav a').forEach(a => {
    a.classList.toggle('active', parseInt(a.dataset.idx) === index);
  });

  const container = document.getElementById('pagesContainer');
  container.innerHTML = `<div class="page active">${renderPageContent(page)}</div>`;

  // Rebind events
  bindPageEvents(page);
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(){
  const today = new Date().toISOString().split('T')[0];
  const todosToday = state.todos[today] || [];
  const doneTodos = todosToday.filter(t => t.done).length;
  const totalFinance = state.finance.reduce((a,b) => a + (b.type==='income'?b.amount:-b.amount), 0);
  const journalToday = state.journal[today] ? '✅ Sudah ditulis' : '❌ Belum ditulis';
  const time = new Date().getHours();
  const greeting = time < 12 ? 'Selamat pagi' : time < 18 ? 'Selamat siang' : 'Selamat malam';
  const hour = new Date().getHours();
  const greeting2 = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';

  return `
    <div class="section-box" style="background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:var(--radius)">
      <h2 style="color:#fff;border:none;margin-bottom:5px">${greeting}, ${state.settings.name}! 👋</h2>
      <p>${greeting2} — Semoga harimu produktif!</p>
    </div>

    <div class="card-grid">
      <div class="card" onclick="goToPage(${PAGES.findIndex(p=>p.type==='todo')})">
        <h3>✅ To-Do Hari Ini</h3>
        <div class="value">${doneTodos}/${todosToday.length}</div>
        <div class="unit">selesai</div>
      </div>
      <div class="card" onclick="goToPage(${PAGES.findIndex(p=>p.type==='finance')})">
        <h3>💰 Saldo</h3>
        <div class="value">Rp ${totalFinance.toLocaleString('id-ID')}</div>
        <div class="unit">total saldo</div>
      </div>
      <div class="card" onclick="goToPage(${PAGES.findIndex(p=>p.type==='goals')})">
        <h3>🎯 Goals</h3>
        <div class="value">${state.goals.length}</div>
        <div class="unit">target aktif</div>
      </div>
      <div class="card" onclick="goToPage(${PAGES.findIndex(p=>p.type==='habit')})">
        <h3>📈 Habit</h3>
        <div class="value">${state.habits.names.length}</div>
        <div class="unit">kebiasaan</div>
      </div>
      <div class="card" onclick="goToPage(${PAGES.findIndex(p=>p.type==='journal')})">
        <h3>📓 Jurnal</h3>
        <div class="value" style="font-size:1rem">${journalToday}</div>
      </div>

        <div class="value">▶️</div>

      </div>

}

/* ---------- CALENDAR ---------- */
let calYear = 2026, calMonth = 0;
function renderCalendar(){
  const monthNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const days = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const today = new Date();
  let html = `
    <div class="calendar-nav">
      <button class="btn" onclick="changeMonth(-1)">← Sebelumnya</button>
      <h3 style="margin:0">${monthNames[calMonth]} ${calYear}</h3>
      <button class="btn" onclick="changeMonth(1)">Selanjutnya →</button>
    </div>
    <div class="calendar-header">${days.map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="calendar">`;
  for(let i=0;i<firstDay;i++) html += '<div class="calendar-day empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const isToday = (d === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear());
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasEvent = state.todos[dateStr] && state.todos[dateStr].length;
    html += `<div class="calendar-day ${isToday?'today':''} ${hasEvent?'has-event':''}"
      onclick="selectDate('${dateStr}')">${d}</div>`;
  }
  html += '</div><div id="dateDetail" style="margin-top:20px"></div>';
  return html;
}
function changeMonth(delta){
  calMonth += delta;
  if(calMonth < 0){ calMonth = 11; calYear--; }
  if(calMonth > 11){ calMonth = 0; calYear++; }
  document.getElementById('pagesContainer').innerHTML =
    `<div class="page active">${renderCalendar()}</div>`;
}
function selectDate(dateStr){
  const todos = state.todos[dateStr] || [];
  const html = `
    <div class="section-box">
      <h3>📅 ${dateStr}</h3>
      <div class="todo-input-row">
        <input type="text" id="calTodoInput" placeholder="Tambah event/tugas...">
        <button class="btn" onclick="addTodoToDate('${dateStr}')">+ Tambah</button>
      </div>
      ${todos.length ? todos.map((t,i)=>`
        <div class="list-item">
          <span>${t.done?'✅':'⬜'} ${t.text}</span>
          <button class="delete-btn" onclick="removeTodoFromDate('${dateStr}',${i})">✕</button>
        </div>`).join('') : '<p style="color:var(--text-light)">Belum ada event</p>'}
    </div>`;
  document.getElementById('dateDetail').innerHTML = html;
}
function addTodoToDate(dateStr){
  const input = document.getElementById('calTodoInput');
  if(!input.value.trim()) return;
  if(!state.todos[dateStr]) state.todos[dateStr] = [];
  state.todos[dateStr].push({ text: input.value.trim(), done:false });
  saveState();
  selectDate(dateStr);
  notify('Event ditambahkan! ✅');
}
function removeTodoFromDate(dateStr, idx){
  state.todos[dateStr].splice(idx,1);
  saveState();
  selectDate(dateStr);
}

/* ---------- TODO ---------- */
let currentTodoDate = new Date().toISOString().split('T')[0];
function renderTodo(){
  const todos = state.todos[currentTodoDate] || [];
  return `
    <div class="section-box">
      <h3>📅 Tanggal: <input type="date" value="${currentTodoDate}" style="width:auto;display:inline-block;padding:6px 10px"
        onchange="currentTodoDate=this.value;renderPage(state.currentPage)"></h3>
    </div>
    <div class="todo-input-row">
      <input type="text" id="todoInput" placeholder="Tugas baru..."
        onkeypress="if(event.key==='Enter') addTodo()">
      <button class="btn" onclick="addTodo()">+ Tambah</button>
    </div>
    <ul class="todo-list">
      ${todos.length ? todos.map((t,i)=>`
        <li class="todo-item ${t.done?'done':''}">
          <input type="checkbox" ${t.done?'checked':''} onchange="toggleTodo(${i})">
          <span>${t.text}</span>
          <button class="delete-btn" onclick="removeTodo(${i})">🗑️</button>
        </li>`).join('') :
        `<div class="empty-state"><div class="icon">📝</div><p>Belum ada tugas untuk tanggal ini</p></div>`}
    </ul>
    <p style="margin-top:15px;color:var(--text-light);font-size:.85rem">
      Total: ${todos.length} | Selesai: ${todos.filter(t=>t.done).length}
    </p>`;
}
function addTodo(){
  const input = document.getElementById('todoInput');
  if(!input.value.trim()) return;
  if(!state.todos[currentTodoDate]) state.todos[currentTodoDate] = [];
  state.todos[currentTodoDate].push({ text: input.value.trim(), done:false });
  saveState();
  renderPage(state.currentPage);
  notify('Tugas ditambahkan! ✅');
}
function toggleTodo(i){
  state.todos[currentTodoDate][i].done = !state.todos[currentTodoDate][i].done;
  saveState();
  renderPage(state.currentPage);
}
function removeTodo(i){
  state.todos[currentTodoDate].splice(i,1);
  saveState();
  renderPage(state.currentPage);
}

/* ---------- GOALS ---------- */
function renderGoals(){
  return `
    <div class="section-box">
      <h3>🎯 Tambah Goal Baru</h3>
      <input type="text" id="goalTitle" placeholder="Judul goal...">
      <input type="number" id="goalTarget" placeholder="Target (angka)" value="100">
      <button class="btn" onclick="addGoal()">+ Tambah Goal</button>
    </div>
    <div id="goalsList">
      ${state.goals.length ? state.goals.map((g,i)=>{
        const pct = Math.min(100, Math.round((g.current/g.target)*100));
        return `
          <div class="goal-item">
            <h4>${g.title}</h4>
            <p style="font-size:.85rem;color:var(--text-light)">Progress: ${g.current} / ${g.target}</p>
            <div class="progress-container"><div class="fill" style="width:${pct}%"></div></div>
            <p style="font-size:.85rem">${pct}% selesai</p>
            <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
              <input type="number" placeholder="Tambah progress" id="prog-${i}" style="width:120px;margin:0">
              <button class="btn btn-sm btn-success" onclick="updateGoal(${i})">Update</button>
              <button class="btn btn-sm btn-danger" onclick="removeGoal(${i})">Hapus</button>
            </div>
          </div>`;
      }).join('') : '<div class="empty-state"><div class="icon">🎯</div><p>Belum ada goal. Tambahkan sekarang!</p></div>'}
    </div>`;
}
function addGoal(){
  const title = document.getElementById('goalTitle').value.trim();
  const target = parseInt(document.getElementById('goalTarget').value) || 100;
  if(!title) return notify('Isi judul goal!', 'error');
  state.goals.push({ title, target, current: 0 });
  saveState();
  renderPage(state.currentPage);
  notify('Goal ditambahkan! 🎯');
}
function updateGoal(i){
  const val = parseInt(document.getElementById(`prog-${i}`).value) || 0;
  state.goals[i].current += val;
  if(state.goals[i].current > state.goals[i].target) state.goals[i].current = state.goals[i].target;
  saveState();
  renderPage(state.currentPage);
  notify('Progress diupdate! 📈');
}
function removeGoal(i){
  state.goals.splice(i,1);
  saveState();
  renderPage(state.currentPage);
}

    html += `<div class="habit-cell name">${name}</div>`;
    for(let d=1;d<=daysInMonth;d++){
      const key = `${hi}-${d}`;
      const done = state.habits.data[key];

  html += '</div></div>';

        <button class="btn" onclick="addHabit()">+ Tambah</button>
      </div>
    </div>`;
  return html;
}
function toggleHabit(key){
  state.habits.data[key] = !state.habits.data[key];
  saveState();
  renderPage(state.currentPage);
}
function addHabit(){
  const v = document.getElementById('newHabit').value.trim();
  if(!v) return;
  state.habits.names.push(v);
  saveState();
  renderPage(state.currentPage);
  notify('Habit ditambahkan! 📈');
}
